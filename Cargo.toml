[package]
name = "clauhist"
version = "1.4.0"
edition = "2021"
description = "Browse Claude Code, Codex, and OpenCode history across working directories and resume sessions"
license = "MIT"
repository = "https://github.com/lef237/clauhist"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rusqlite = { version = "0.41", features = ["bundled"] }
